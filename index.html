<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>班主任学生管理工作台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#111827; --muted:#6b7280; --line:#e8ecf7;
  --shadow:0 10px 30px rgba(67,56,202,.09);
  --shadow-sm:0 4px 14px rgba(67,56,202,.07);
}
html,body{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;
  background:#f2f5ff;
  background-image:
    radial-gradient(900px 520px at 6% -10%, #ddd6fe 0%, rgba(221,214,254,0) 62%),
    radial-gradient(880px 480px at 98% -6%, #cffafe 0%, rgba(207,250,254,0) 58%),
    radial-gradient(760px 520px at 50% 112%, #fce7f3 0%, rgba(252,231,243,0) 60%);
  background-attachment:fixed;
  padding:18px 18px 70px;
}
.shell{max-width:1180px;margin:0 auto}

/* ---------- HERO ---------- */
.hero{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:20px 24px;border-radius:24px;color:#fff;
  background:linear-gradient(120deg,#7c3aed 0%,#4f46e5 42%,#06b6d4 100%);
  box-shadow:0 18px 40px rgba(79,70,229,.28);
  position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-90px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.28),transparent 68%);
}
.hero-l{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.logo{
  width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
  font-size:22px;font-weight:800;letter-spacing:1px;flex:0 0 auto;
  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(6px);
}
.hero h1{font-size:21px;font-weight:800;letter-spacing:.5px}
.hero .sub{font-size:12.5px;opacity:.88;margin-top:5px}
.hero .sub b{font-weight:700}
.hero-r{position:relative;z-index:1;text-align:right}
.clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.clock small{display:block;font-size:11px;font-weight:500;opacity:.8;letter-spacing:1px;margin-top:2px}

/* ---------- STATS ---------- */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.stat{
  border:1px solid rgba(99,102,241,.10);background:#fff;border-radius:16px;padding:12px 14px;
  text-align:left;cursor:pointer;box-shadow:var(--shadow-sm);transition:.18s;position:relative;overflow:hidden;
  display:flex;align-items:center;gap:10px;font-family:inherit;
}
.stat:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(67,56,202,.14)}
.stat .bar{width:5px;align-self:stretch;border-radius:99px;flex:0 0 auto}
.stat .num{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.5px}
.stat.active{border-color:transparent;box-shadow:0 0 0 2px #6366f1,0 12px 24px rgba(67,56,202,.18)}
.bar-in{background:linear-gradient(180deg,#34d399,#059669)}
.bar-leave{background:linear-gradient(180deg,#fbbf24,#f97316)}
.bar-absent{background:linear-gradient(180deg,#fb7185,#dc2626)}
.bar-out{background:linear-gradient(180deg,#60a5fa,#0284c7)}
.bar-all{background:linear-gradient(180deg,#a78bfa,#4f46e5)}

/* ---------- LAYOUT ---------- */
.layout{display:grid;grid-template-columns:238px 1fr;gap:16px;margin-top:16px;align-items:start}
.side{
  background:#fff;border:1px solid rgba(99,102,241,.10);border-radius:20px;padding:14px;
  box-shadow:var(--shadow);position:sticky;top:16px;
}
.side-title{font-size:11px;font-weight:700;color:#8b90a8;letter-spacing:1.4px;margin:6px 4px 8px}
.side-title:first-child{margin-top:0}
.s-item{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 12px;border-radius:12px;border:none;background:transparent;cursor:pointer;
  font-family:inherit;font-size:13.5px;color:#374151;transition:.15s;text-align:left;
}
.s-item:hover{background:#f4f6ff}
.s-item.active{background:linear-gradient(120deg,#eef2ff,#e0f2fe);color:#4338ca;font-weight:700}
.s-item b{font-size:11.5px;font-weight:700;background:#eef2ff;color:#4f46e5;border-radius:99px;padding:1px 8px}
.s-item.active b{background:#4f46e5;color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:-1px}
.nav-room{
  width:100%;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;border:none;
  background:transparent;cursor:pointer;font-family:inherit;font-size:13px;color:#4b5563;text-align:left;transition:.15s;
}
.nav-room:hover{background:#f4f6ff;color:#4338ca}
.nav-room .nr{font-weight:700;font-variant-numeric:tabular-nums;color:#1f2937}
.nav-room .nc{margin-left:auto;font-size:11px;color:#9ca3af;font-variant-numeric:tabular-nums}
.side-actions{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:grid;gap:8px}
.sbtn{
  padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:600;color:#374151;transition:.15s;
}
.sbtn:hover{background:#f8faff;border-color:#c7d2fe;color:#4338ca}
.sbtn.primary{background:linear-gradient(120deg,#4f46e5,#06b6d4);color:#fff;border:none;box-shadow:0 8px 18px rgba(79,70,229,.28)}
.sbtn.primary:hover{filter:brightness(1.06);color:#fff}

/* ---------- BOARD ---------- */
.main{display:grid;gap:14px}
.group-head{display:flex;align-items:center;gap:10px;padding:2px 6px;margin-top:4px}
.group-head .gt{font-size:14.5px;font-weight:800;letter-spacing:.4px}
.group-head .gc{font-size:11.5px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.room{
  background:#fff;border:1px solid rgba(99,102,241,.10);border-radius:18px;overflow:hidden;
  box-shadow:var(--shadow-sm);transition:.2s;
}
.room:hover{box-shadow:var(--shadow)}
.room-head{
  display:flex;align-items:center;gap:10px;padding:11px 16px;
  background:linear-gradient(90deg,#ecfdf5,#f0fdfa);border-bottom:1px solid #e6f7f0;
}
.room.warn .room-head{background:linear-gradient(90deg,#fff7ed,#fff1f2);border-bottom-color:#ffe4d5}
.room-id{
  font-size:14px;font-weight:800;color:#065f46;background:#d1fae5;border-radius:10px;padding:3px 10px;
  font-variant-numeric:tabular-nums;letter-spacing:.3px;
}
.room.warn .room-id{color:#9a3412;background:#ffedd5}
.room-sub{font-size:12px;color:#64748b}
.room-badge{
  margin-left:auto;font-size:11.5px;font-weight:700;border-radius:99px;padding:4px 11px;white-space:nowrap;
  background:#dcfce7;color:#15803d;
}
.room.warn .room-badge{background:#ffedd5;color:#c2410c}

.rows{padding:4px 8px 8px}
.row{
  display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:12px;transition:.15s;
}
.row + .row{border-top:1px solid #f3f5fb}
.row:hover{background:#f8faff}
.av{
  width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  font-size:14px;font-weight:800;color:#fff;letter-spacing:0;
}
.girls .av{background:linear-gradient(135deg,#f472b6,#a855f7)}
.boys .av{background:linear-gradient(135deg,#38bdf8,#6366f1)}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.who-txt{min-width:0}
.nm{font-size:15px;font-weight:700;letter-spacing:.3px;display:block}
.nt{
  display:block;font-size:11.5px;color:#b45309;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px;
}
.acts{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:6px 15px;border-radius:99px;border:none;
  font-family:inherit;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;transition:.16s;letter-spacing:.5px;
  min-width:78px;justify-content:center;
}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.9)}
.pill:hover{transform:translateY(-1px);filter:brightness(1.05)}
.st-in{background:linear-gradient(135deg,#34d399,#059669);box-shadow:0 5px 12px rgba(16,185,129,.32)}
.st-leave{background:linear-gradient(135deg,#fbbf24,#f97316);box-shadow:0 5px 12px rgba(245,158,11,.32)}
.st-absent{background:linear-gradient(135deg,#fb7185,#dc2626);box-shadow:0 5px 12px rgba(239,68,68,.3)}
.st-out{background:linear-gradient(135deg,#60a5fa,#0284c7);box-shadow:0 5px 12px rgba(59,130,246,.3)}
.note-btn{
  width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;
  color:#9ca3af;display:grid;place-items:center;transition:.15s;
}
.note-btn:hover{border-color:#c7d2fe;color:#4f46e5;background:#f8faff}
.note-btn.on{border-color:#fcd34d;background:#fffbeb;color:#d97706}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13.5px;background:#fff;border-radius:18px;border:1px dashed var(--line)}

/* ---------- POPOVER / MODAL ---------- */
.pop{
  position:fixed;z-index:60;background:#fff;border-radius:16px;padding:8px;min-width:168px;
  box-shadow:0 18px 44px rgba(30,27,75,.22);border:1px solid rgba(99,102,241,.12);
  opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;transition:.16s;
}
.pop.show{opacity:1;transform:none;pointer-events:auto}
.pop-t{font-size:11px;color:#8b90a8;font-weight:700;letter-spacing:1px;padding:5px 10px 7px}
.pop-b{
  width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:11px;border:none;
  background:transparent;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;color:#374151;
  text-align:left;transition:.13s;
}
.pop-b:hover{background:#f4f6ff}
.pop-b.cur{background:#eef2ff;color:#4338ca}
.pop-b .sw{width:10px;height:10px;border-radius:4px;flex:0 0 auto}
.pop-sep{height:1px;background:var(--line);margin:6px 4px}

.mask{
  position:fixed;inset:0;background:rgba(17,24,39,.42);backdrop-filter:blur(3px);z-index:80;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.mask.show{display:flex}
.dlg{
  background:#fff;border-radius:20px;padding:22px;width:100%;max-width:400px;box-shadow:0 28px 60px rgba(30,27,75,.3);
}
.dlg h3{font-size:16px;font-weight:800;margin-bottom:4px}
.dlg p{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.dlg textarea{
  width:100%;min-height:96px;border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical;
  font-family:inherit;font-size:14px;color:var(--ink);outline:none;transition:.15s;background:#fbfcff;
}
.dlg textarea:focus{border-color:#a5b4fc;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.dlg-acts{display:flex;gap:10px;margin-top:16px}
.dlg-acts button{flex:1;padding:11px;border-radius:13px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:#374151;transition:.15s}
.dlg-acts button:hover{background:#f8faff}
.dlg-acts .ok{background:linear-gradient(120deg,#4f46e5,#06b6d4);color:#fff;border:none;box-shadow:0 8px 18px rgba(79,70,229,.28)}
.dlg-acts .ok:hover{filter:brightness(1.06);background:linear-gradient(120deg,#4f46e5,#06b6d4)}
.toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:#111827;color:#fff;
  padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;
  transition:.25s;z-index:99;box-shadow:0 14px 30px rgba(0,0,0,.25);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  body{padding:12px 12px 60px}
  .hero{padding:16px 18px;border-radius:20px}
  .hero h1{font-size:17px}
  .clock{font-size:20px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .layout{grid-template-columns:1fr;gap:12px}
  .side{position:static}
  .side .side-title:nth-of-type(2),#navRooms{display:none}
  .side-actions{grid-template-columns:1fr 1fr}
  .sbtn.primary{grid-column:1/-1}
  .nm{font-size:14.5px}
  .pill{min-width:70px;padding:6px 12px;font-size:12px}
}
</style>
</head>
<body>
<div class="shell">

  <header class="hero">
    <div class="hero-l">
      <div class="logo" id="logoChar">班</div>
      <div>
        <h1>班主任学生管理工作台</h1>
        <p class="sub"><span id="today">--</span> · 共 <b id="heroTotal">0</b> 名学生 · <b id="heroRoom">0</b> 间宿舍 · 数据自动保存在本机</p>
      </div>
    </div>
    <div class="hero-r">
      <div class="clock"><span id="clock">--:--:--</span><small>实时状态</small></div>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <div class="layout">
    <aside class="side">
      <div class="side-title">状态筛选</div>
      <div id="filters"></div>
      <div class="side-title">宿舍导航</div>
      <div id="navRooms"></div>
      <div class="side-actions">
        <button class="sbtn primary" id="btnAllIn">一键全部设为在寝</button>
        <button class="sbtn" id="btnExport">导出名单</button>
        <button class="sbtn" id="btnReset">清空记录</button>
      </div>
    </aside>
    <main class="main" id="board"></main>
  </div>

</div>

<div class="pop" id="pop">
  <div class="pop-t">设为状态</div>
  <div id="popBody"></div>
</div>

<div class="mask" id="mask">
  <div class="dlg">
    <h3 id="dlgTitle">备注</h3>
    <p id="dlgSub"></p>
    <textarea id="dlgText" placeholder="例如：回家 / 看病 / 家长已联系…"></textarea>
    <div class="dlg-acts">
      <button id="dlgCancel">取消</button>
      <button class="ok" id="dlgSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 数据（来自《宿舍分寝表》） ================= */
const DATA = [
  {
    id: "girls", title: "女生 · 3号瑾苑楼", short: "3号瑾苑楼",
    rooms: [
      { room: "310", members: ["陈星霓","崔煜苒","范文静","井岚煜","夏宛茹","丁雨珊"] },
      { room: "309", members: ["金语心","徐婷睿","张怡","张紫涵","曹伊嘉","陈瑾涵"] },
      { room: "308", members: ["陈依","郭彩云","李佳灵","裴丹丹","肖诺羲","王婉茹"] },
      { room: "307", members: ["李佳艺","杨瑾萱","徐雨涵","徐艺恬","张优优","刘伊萱"] },
      { room: "223", members: ["田玉溪"] }
    ]
  },
  {
    id: "boys", title: "男生 · 1号睿园楼", short: "1号睿园楼",
    rooms: [
      { room: "526", members: ["高奥宁","岳一帆","张烜赫","罗志豪","任旭柯","孙俊杰"] },
      { room: "527", members: ["田博文","张清泉","王泽","陈鹏旭","朱芃语","谢宗言"] },
      { room: "528", members: ["古钦","郭传厚","郭伟航","李嘉硕","吕宜航","任天宇"] },
      { room: "4号楼107", members: ["徐杨毅","周天赐","朱志祥","张怡旺","左钰尧","王义涵"] },
      { room: "4号楼109", members: ["胡雅伦","赵晨洋","黄耀贤","王子涵","高羽祥","蒋延冲"] }
    ]
  }
];

const STATUS = {
  in:     { label: "在寝", color: "#10b981", flag: "in" },
  leave:  { label: "请假", color: "#f59e0b", flag: "leave" },
  absent: { label: "未归", color: "#ef4444", flag: "absent" },
  out:    { label: "外出", color: "#3b82f6", flag: "out" }
};
const ORDER = ["in", "leave", "absent", "out"];
const FILTERS = [
  { id: "all",    label: "全部学生", color: "linear-gradient(180deg,#a78bfa,#4f46e5)" },
  { id: "in",     label: "在寝",     color: "linear-gradient(180deg,#34d399,#059669)" },
  { id: "leave",  label: "请假",     color: "linear-gradient(180deg,#fbbf24,#f97316)" },
  { id: "absent", label: "未归",     color: "linear-gradient(180deg,#fb7185,#dc2626)" },
  { id: "out",    label: "外出",     color: "linear-gradient(180deg,#60a5fa,#0284c7)" }
];

/* ================= 存储 ================= */
const KEY = "dorm-desk-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }

function idOf(g, room, name) { return g.id + "|" + room + "|" + name; }
function rec(id) { return store[id] || {}; }
function stOf(id) { const r = rec(id); return STATUS[r.s] ? r.s : "in"; }
function noteOf(id) { return rec(id).note || ""; }
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
}

/* ================= 状态 ================= */
let curFilter = "all";
let curSearch = "";
let popTarget = null;

const boardEl   = document.getElementById("board");
const statsEl   = document.getElementById("stats");
const filtersEl = document.getElementById("filters");
const navEl     = document.getElementById("navRooms");
const popEl     = document.getElementById("pop");
const popBody   = document.getElementById("popBody");
const maskEl    = document.getElementById("mask");
const dlgText   = document.getElementById("dlgText");
const dlgTitle  = document.getElementById("dlgTitle");
const dlgSub    = document.getElementById("dlgSub");
let dlgTarget = null;

/* ================= 渲染 ================= */
function counts() {
  const c = { all: 0, in: 0, leave: 0, absent: 0, out: 0 };
  DATA.forEach(g => g.rooms.forEach(r => r.members.forEach(n => {
    c.all++; c[stOf(idOf(g, r.room, n))]++;
  })));
  return c;
}

function renderStats() {
  const c = counts();
  statsEl.innerHTML = FILTERS.map(f => `
    <button class="stat ${curFilter === f.id ? "active" : ""}" data-filter="${f.id}">
      <span class="bar bar-${f.id}"></span>
      <span>
        <span class="num">${c[f.id]}</span>
        <span class="lbl">${f.label}</span>
      </span>
    </button>`).join("");
}

function renderFilters() {
  const c = counts();
  filtersEl.innerHTML = FILTERS.map(f => `
    <button class="s-item ${curFilter === f.id ? "active" : ""}" data-filter="${f.id}">
      <span><span class="dot" style="background:${f.color}"></span>${f.label}</span>
      <b>${c[f.id]}</b>
    </button>`).join("");
}

function renderNav() {
  let h = "";
  DATA.forEach(g => {
    h += `<div class="side-title" style="margin:10px 4px 6px">${g.short}</div>`;
    g.rooms.forEach(r => {
      const inN = r.members.filter(n => stOf(idOf(g, r.room, n)) === "in").length;
      const full = inN === r.members.length;
      h += `<button class="nav-room" data-goto="${g.id}|${r.room}">
              <span class="nr">${r.room}</span>
              <span class="nc" style="color:${full ? "#10b981" : "#f59e0b"}">${inN}/${r.members.length}</span>
            </button>`;
    });
  });
  navEl.innerHTML = h;
}

function renderBoard() {
  const kw = curSearch.trim();
  let html = "";
  let shown = 0;

  DATA.forEach(g => {
    let roomsHtml = "";
    let gTotal = 0;

    g.rooms.forEach(r => {
      const list = r.members
        .map(n => ({ name: n, id: idOf(g, r.room, n) }))
        .filter(m => {
          if (kw && m.name.indexOf(kw) === -1) return false;
          if (curFilter !== "all" && stOf(m.id) !== curFilter) return false;
          return true;
        });
      if (!list.length) return;

      const inN   = r.members.filter(n => stOf(idOf(g, r.room, n)) === "in").length;
      const full  = inN === r.members.length;
      gTotal += list.length;

      const rows = list.map(m => {
        const s    = stOf(m.id);
        const note = noteOf(m.id);
        return `<div class="row">
          <div class="who">
            <div class="av">${m.name.slice(0, 1)}</div>
            <div class="who-txt">
              <span class="nm">${m.name}</span>
              ${note ? `<span class="nt" title="${note}">备注：${note}</span>` : ""}
            </div>
          </div>
          <div class="acts">
            <button class="pill st-${s}" data-pop="${m.id}">${STATUS[s].label}</button>
            <button class="note-btn ${note ? "on" : ""}" data-note="${m.id}" title="备注">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
              </svg>
            </button>
          </div>
        </div>`;
      }).join("");

      roomsHtml += `<section class="room ${full ? "" : "warn"}" id="room-${g.id}-${r.room}">
        <div class="room-head">
          <span class="room-id">${r.room} 室</span>
          <span class="room-sub">${g.short}</span>
          <span class="room-badge">${inN}/${r.members.length} ${full ? "全寝在寝" : "在寝"}</span>
        </div>
        <div class="rows">${rows}</div>
      </section>`;
    });

    if (roomsHtml) {
      shown += gTotal;
      html += `<div class="group-head"><span class="gt">${g.title}</span><span class="gc">${gTotal} 人</span></div>${roomsHtml}`;
    }
  });

  if (!html) {
    html = `<div class="empty">没有符合条件的学生</div>`;
  }
  boardEl.innerHTML = html;
}

function renderAll() {
  renderStats();
  renderFilters();
  renderNav();
  renderBoard();
  const c = counts();
  document.getElementById("heroTotal").textContent = c.all;
  document.getElementById("heroRoom").textContent =
    DATA.reduce((a, g) => a + g.rooms.length, 0);
}

/* ================= 状态选择浮层 ================= */
function openPop(anchor, id) {
  popTarget = id;
  const cur = stOf(id);
  popBody.innerHTML = ORDER.map(k => `
    <button class="pop-b ${cur === k ? "cur" : ""}" data-set="${k}">
      <span class="sw" style="background:${STATUS[k].color}"></span>${STATUS[k].label}
    </button>`).join("") +
    `<div class="pop-sep"></div>
     <button class="pop-b" data-editnote="1">
       <span class="sw" style="background:#c7d2fe"></span>编辑备注
     </button>`;

  popEl.classList.add("show");
  const r = anchor.getBoundingClientRect();
  const w = popEl.offsetWidth;
  const h = popEl.offsetHeight;
  let left = Math.min(r.left, window.innerWidth - w - 12);
  left = Math.max(12, left);
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 8);
  popEl.style.left = left + "px";
  popEl.style.top = top + "px";
}
function closePop() { popEl.classList.remove("show"); popTarget = null; }

/* ================= 备注弹窗 ================= */
function openNote(id) {
  dlgTarget = id;
  const parts = id.split("|");
  dlgTitle.textContent = "备注 · " + parts[2];
  dlgSub.textContent = (parts[0] === "girls" ? "女生 3号瑾苑楼 " : "男生 1号睿园楼 ") + parts[1] + " 室";
  dlgText.value = noteOf(id);
  maskEl.classList.add("show");
  setTimeout(() => dlgText.focus(), 60);
}
function closeNote() { maskEl.classList.remove("show"); dlgTarget = null; }

/* ================= 事件 ================= */
document.addEventListener("click", e => {
  const t = e.target;

  const popBtn = t.closest("[data-pop]");
  if (popBtn) {
    const id = popBtn.getAttribute("data-pop");
    if (popTarget === id && popEl.classList.contains("show")) closePop();
    else openPop(popBtn, id);
    e.stopPropagation();
    return;
  }

  const setBtn = t.closest("[data-set]");
  if (setBtn && popTarget) {
    const k = setBtn.getAttribute("data-set");
    const id = popTarget;
    const r = rec(id);
    store[id] = { s: k, note: r.note || "" };
    if (!store[id].note) delete store[id].note;
    persist(); closePop(); renderAll(); toast("已更新为「" + STATUS[k].label + "」");
    return;
  }

  const editNote = t.closest("[data-editnote]");
  if (editNote && popTarget) {
    const id = popTarget;
    closePop(); openNote(id);
    return;
  }

  const noteBtn = t.closest("[data-note]");
  if (noteBtn) { openNote(noteBtn.getAttribute("data-note")); return; }

  const fBtn = t.closest("[data-filter]");
  if (fBtn) { curFilter = fBtn.getAttribute("data-filter"); renderAll(); return; }

  const goBtn = t.closest("[data-goto]");
  if (goBtn) {
    const p = goBtn.getAttribute("data-goto").split("|");
    const el = document.getElementById("room-" + p[0] + "-" + p[1]);
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.animate(
        [{ boxShadow: "0 0 0 0 rgba(99,102,241,.55)" }, { boxShadow: "0 0 0 8px rgba(99,102,241,0)" }],
        { duration: 900, easing: "ease-out" }
      );
    }
    return;
  }

  if (!popEl.contains(t)) closePop();
});

maskEl.addEventListener("click", e => { if (e.target === maskEl) closeNote(); });
document.getElementById("dlgCancel").addEventListener("click", closeNote);
document.getElementById("dlgSave").addEventListener("click", () => {
  if (!dlgTarget) return;
  const id = dlgTarget;
  const txt = dlgText.value.trim();
  const s = stOf(id);
  if (txt) store[id] = { s: s, note: txt };
  else if (store[id]) { store[id].note = ""; delete store[id].note; }
  if (store[id] && !store[id].note && store[id].s === "in") delete store[id];
  persist(); closeNote(); renderAll(); toast("备注已保存");
});

document.getElementById("btnAllIn").addEventListener("click", () => {
  if (!confirm("确定把全部学生状态设为「在寝」吗？")) return;
  DATA.forEach(g => g.rooms.forEach(r => r.members.forEach(n => {
    const id = idOf(g, r.room, n);
    const note = noteOf(id);
    store[id] = { s: "in" };
    if (note) store[id].note = note;
  })));
  persist(); renderAll(); toast("已全部设为在寝");
});

document.getElementById("btnReset").addEventListener("click", () => {
  if (!confirm("确定清空全部状态与备注记录吗？（学生名单不受影响）")) return;
  store = {}; persist(); renderAll(); toast("已清空全部记录");
});

document.getElementById("btnExport").addEventListener("click", () => {
  const head = ["楼栋", "宿舍", "姓名", "状态", "备注"].join(",");
  const lines = [];
  DATA.forEach(g => g.rooms.forEach(r => r.members.forEach(n => {
    const id = idOf(g, r.room, n);
    const note = noteOf(id).replace(/"/g, '""');
    lines.push([g.short, r.room, n, STATUS[stOf(id)].label, note ? '"' + note + '"' : ""].join(","));
  })));
  const csv = "\ufeff" + [head].concat(lines).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const d = new Date();
  const stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "宿舍查寝_" + stamp + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出 CSV 名单");
});

/* ================= 搜索 / 时钟 / 提示 ================= */
const searchInput = document.createElement("input");
searchInput.type = "search";
searchInput.placeholder = "搜索学生姓名…";
searchInput.style.cssText = "margin-top:12px;width:100%;padding:12px 16px;border-radius:16px;border:1px solid rgba(99,102,241,.16);background:#fff;font-family:inherit;font-size:14px;outline:none;box-shadow:0 4px 14px rgba(67,56,202,.07)";
searchInput.addEventListener("input", () => { curSearch = searchInput.value; renderBoard(); });
searchInput.addEventListener("focus", () => { searchInput.style.borderColor = "#a5b4fc"; });
searchInput.addEventListener("blur",  () => { searchInput.style.borderColor = "rgba(99,102,241,.16)"; });
document.querySelector(".shell").insertBefore(searchInput, statsEl);

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
}

function tick() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  document.getElementById("clock").textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  const wk = ["日","一","二","三","四","五","六"][d.getDay()];
  document.getElementById("today").textContent =
    d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日 星期" + wk;
}

window.addEventListener("scroll", closePop, { passive: true });
window.addEventListener("resize", closePop);

tick();
setInterval(tick, 1000);
renderAll();
</script>
</body>
</html>
